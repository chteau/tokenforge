<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TokenForge</title>
  <meta name="description" content="%DESC%">
  <link rel="canonical" href="%SITE%">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#d16a47">
  <meta name="color-scheme" content="dark light">

  <!-- Open Graph (Discord, Slack, LinkedIn, Facebook, iMessage) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TokenForge">
  <meta property="og:url" content="%SITE%">
  <meta property="og:title" content="%TITLE%">
  <meta property="og:description" content="%DESC%">
  <meta property="og:image" content="%SITE%og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="%IMG_ALT%">
  <meta property="og:locale" content="en_US">

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="%TITLE%">
  <meta name="twitter:description" content="%DESC%">
  <meta name="twitter:image" content="%SITE%og.png">
  <meta name="twitter:image:alt" content="%IMG_ALT%">

  <!-- Google: structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "TokenForge",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Linux, macOS, Windows",
    "softwareVersion": "%VERSION%",
    "description": "%DESC%",
    "url": "%SITE%",
    "image": "%SITE%og.png",
    "license": "https://opensource.org/licenses/MIT",
    "codeRepository": "https://github.com/chteau/tokenforge",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#/" aria-label="TokenForge home"><img class="mark" src="/logo.svg" alt="" width="26" height="26">TokenForge</a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
    </div>
  </header>
  <div class="main">
    <main id="view" tabindex="-1"></main>
    <footer class="foot">
      <span>TokenForge 0.9.0 · MIT licensed · <a href="https://github.com/chteau/tokenforge">github.com/chteau/tokenforge</a></span>
      <span class="muted">Every number on this site comes from the plugin repo's <code>bench/</code> data and README.</span>
    </footer>
  </div>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
