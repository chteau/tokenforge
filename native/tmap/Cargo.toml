[package]
name = "tmap"
version = "0.1.0"
edition = "2021"
description = "Fast code map for coding agents: ranked symbol search, outline trees, call edges"
license = "MIT"
publish = false

[dependencies]
tree-sitter = "0.27"
tree-sitter-tags = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
