name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/*.test.mjs
      - name: CLI smoke test
        run: node bin/tforge --version && node bin/tforge --help
  windows-smoke:
    # Node tests run on Linux/macOS; on Windows, at least load every module and start the dashboard.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import every lib module
        shell: bash
        run: for f in lib/*.mjs; do node -e "import('./$f').catch(e => { console.error('$f', e); process.exit(1) })" || exit 1; done
      - name: CLI and dashboard
        shell: bash
        run: |
          node bin/tforge --version
          node bin/tforge ui --detach
          for i in $(seq 20); do node bin/tforge ui --status | grep -q "running at http://127.0.0.1" && break; sleep 1; done
          node bin/tforge ui --status | grep "running at http://127.0.0.1"
          node bin/tforge ui --stop
      - name: Proxy and command resolution tests
        run: node --test test/proxy.test.mjs test/portable.test.mjs
      - name: Proxy daemon
        shell: bash
        run: |
          node bin/tforge proxy --detach --port 7899
          node bin/tforge proxy --status | grep "running on 127.0.0.1:7899"
          node bin/tforge proxy --stop
      - name: tforge claude through a .cmd shim
        shell: bash
        run: |
          mkdir -p shim
          printf '@echo off\r\nnode "%%~dp0check.js" %%*\r\n' > shim/fakeclaude.cmd
          echo 'process.exit(process.env.ANTHROPIC_BASE_URL === "http://127.0.0.1:7898" && process.argv[2] === "a \"b\" & %x%" ? 0 : 5)' > shim/check.js
          PATH="$PWD/shim:$PATH" TFORGE_CLAUDE=fakeclaude TFORGE_PROXY_PORT=7898 node bin/tforge claude 'a "b" & %x%'
          node bin/tforge proxy --stop
      - name: Full test suite (informational until it passes on Windows)
        continue-on-error: true
        run: node --test test/*.test.mjs
  tmap:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --manifest-path native/tmap/Cargo.toml -- --test-threads=1
